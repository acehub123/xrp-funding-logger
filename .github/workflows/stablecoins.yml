name: stablecoin-supply-logger
on:
  schedule:
    - cron: "10 2 * * *"   # ~02:00 UTC: logs the prior closed UTC day (DefiLlama rolls over at 00:00)
    - cron: "10 4 * * *"   # retry if 02:10 failed (e.g. day not closed yet); skips if today's row exists
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:            # own group: sharing funding-logger's would let a queued run cancel a pending funding poll
  group: stablecoin-logger
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python stablecoin_logger.py   # non-zero on a bad response / missing coin / day not closed -> run fails, nothing committed
      - run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          git add data/stablecoin_supply.csv
          git commit -m "stablecoin supply $(date -u +%FT%TZ)" || exit 0
          # the funding logger pushes to this repo every 15 min: rebase onto it and retry
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((10 * i)); done; exit 1
