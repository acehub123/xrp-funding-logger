name: xrp-perp-funding-logger
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, offset off :00 (top-of-hour cron load causes the worst delays)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:            # a delayed run can't overlap the next one and race the push
  group: funding-logger
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python log_funding.py
      - run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          git add xrp_perp_funding_published.csv
          git commit -m "funding poll $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
